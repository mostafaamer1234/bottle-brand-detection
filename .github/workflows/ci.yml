name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mat-io pillow pytest
      - name: Decode MATLAB ground truth and validate YOLO conversion
        working-directory: python
        run: pytest -q
