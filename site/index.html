<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Bottle Detector · Branded or generic, live on your camera</title>
  <meta name="description" content="Point your camera at a bottle and a YOLO11 model labels it branded or generic, live, on your device. Or drop in a photo. Nothing is uploaded." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M6 11V6h5M21 6h5v5M26 21v5h-5M11 26H6v-5' stroke='%23ffd60a' stroke-width='2.4' fill='none'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="cam.css" />
</head>
<body>
  <div class="cam">
    <header class="hud-top">
      <a class="name" href="/">BOTTLE<span>·</span>DETECTOR</a>
      <div class="readout"><span id="mode-tag">PHOTO</span><span id="fps"></span></div>
      <nav><a href="/about">About</a><a href="https://github.com/mostafaamer1234/DeepLearning-ComputerVision-BrandedVS.Generic-Bottle-Detection-Using-YOLOv2">Code</a></nav>
    </header>

    <main class="finder" id="finder">
      <video id="video" playsinline muted></video>
      <canvas id="view" aria-label="Camera or photo with detected bottles"></canvas>
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="status" id="status">Loading the model…</div>
      <div class="tally" id="tally"></div>
    </main>

    <section class="controls">
      <div class="thr"><label for="thr">Confidence</label><input type="range" id="thr" min="5" max="90" value="25" /><output id="thr-v">25%</output></div>
      <div class="buttons">
        <label class="round" title="Use a photo from your device"><input type="file" id="file" accept="image/*" hidden /><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="9" cy="10" r="2" /><path d="M21 16l-5-5-8 8" /></svg><span>Photo</span></label>
        <button class="shutter" id="live" type="button" aria-pressed="false" title="Start the live camera"><i></i></button>
        <button class="round" id="flip" type="button" title="Switch camera" disabled><svg viewBox="0 0 24 24"><path d="M4 7h11l-3-3M20 17H9l3 3" /></svg><span>Flip</span></button>
      </div>
      <div class="roll" id="roll" aria-label="Sample photos the model never saw"></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script src="cam.js"></script>
</body>
</html>
